# file: .github/workflows/ci.yml
# version: 1.1.0
# guid: a3b4c5d6-e7f8-9012-a678-123456789012

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Action
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          submodules: recursive

      - name: Validate action.yml
        run: |
          if [ ! -f action.yml ]; then
            echo "Error: action.yml not found"
            exit 1
          fi
          echo "✅ action.yml validation passed"

  test:
    name: Test Action
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          submodules: recursive

      - name: Setup Buf
        uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1.50.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create test proto project
        run: |
          mkdir -p test-project/proto
          cat > test-project/buf.yaml << 'EOF'
          version: v1
          name: buf.build/test/project
          breaking:
            use:
              - FILE
          lint:
            use:
              - STANDARD
          EOF

          # buf resolves a file's expected directory from the LINT INPUT ROOT,
          # which for `buf lint --config <cfg>` is the working directory, not
          # the directory holding buf.yaml and not the action's `proto-dir`
          # input (that input is only wired into the Docker code path). So a
          # file declaring `package test.v1` must live at ./test/v1/ relative
          # to the repo root, or buf fails with:
          #   Files with package "test.v1" must be within a directory "test/v1"
          #   relative to root but were in directory "test-project/proto/test/v1"
          mkdir -p test/v1

          cat > test/v1/test.proto << 'EOF'
          syntax = "proto3";

          package test.v1;

          message TestMessage {
            string id = 1;
            string name = 2;
          }
          EOF

      - name: Test action execution
        uses: ./
        with:
          buf-version: 'latest'
          proto-dir: '.'
          buf-config: './test-project/buf.yaml'
          generate-sdks: 'false'
          run-lint: 'true'
          run-breaking: 'false'

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          submodules: recursive

      # yamllint is invoked directly rather than through a third-party action.
      # This repo's Actions policy is allowed_actions=selected with
      # github_owned_allowed=false, patterns_allowed=[jdfalk/*] and
      # verified_allowed=true. The previous step referenced an UNVERIFIED
      # publisher that does not match jdfalk/*, so GitHub refused to compile
      # this workflow at all: every CI run concluded `startup_failure` with
      # zero jobs, the required status checks never reported, and every PR sat
      # blocked. Found 2026-08-21 by bisection; this job passes under the same
      # policy once the blocked action reference is gone.
      - name: Run yamllint
        run: |
          pipx install yamllint
          yamllint action.yml
